# پراکسی‌های مورد اعتماد «جلوی» همین nginx (Caddy / nginx میزبان / load balancer ابر).
# پیش‌فرض خالی = nginx مستقیماً به اینترنت وصل است؛ هیچ X-Forwarded-For ای از بیرون پذیرفته نمی‌شود.
#
# اگر یک پراکسی HTTPS جلوی این بسته است، «فقط آدرس همان پراکسی» را بنویسید (نه ۰.۰.۰.۰/۰!). مثال‌ها:
#   Caddy/nginx روی همین میزبان و پورت منتشرشدهٔ docker:   set_real_ip_from 172.16.0.0/12;   # آدرس gateway شبکهٔ docker
#   Load balancer ابر با آدرس ثابت:                            set_real_ip_from 10.0.5.7;
# بعد از تغییر:  docker compose exec web nginx -s reload
# مهم: پراکسی جلویی باید خودش X-Forwarded-For را «بنویسد/بازنویسی کند» (Caddy و nginx با $remote_addr همین کار را می‌کنند).
