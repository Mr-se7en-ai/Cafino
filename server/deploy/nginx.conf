# برنامه (فایل‌های ثابت PWA) + API روی یک مبدأ؛ HTTPS را لایهٔ جلو (Caddy / nginx میزبان / ابر) انجام می‌دهد.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 2m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 1024;

  # IP واقعی کاربر: فقط اگر اتصال از پراکسی «مورد اعتماد» آمده باشد X-Forwarded-For او خوانده می‌شود (فهرست در trusted-proxies.conf، پیش‌فرض خالی).
  # بدون این فهرست، $remote_addr همان IP اتصال TCP است و هر X-Forwarded-For ارسالی کاربر نادیده گرفته می‌شود.
  include /etc/nginx/trusted-proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  include /etc/nginx/csp.conf;                                     # CSP با هش اسکریپت‌های درون‌خطی (deploy/make-csp.mjs)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # ── دریافت فایل از مشتری (QR): صفحهٔ عمومی /u/<code> و آپلود چندبخشی تا ~۱۱۰ مگابایت ──
  # صفحهٔ /u/ CSP اختصاصی خودش را از API می‌گیرد؛ CSP برنامهٔ اصلی روی آن اعمال نشود (add_header اینجا عمداً فقط موارد لازم است).
  location /u/ {
    client_max_body_size 1k;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
  location /api/public/upload/ {
    client_max_body_size 110m;
    proxy_request_buffering off;       # فایل مستقیم به API جریان می‌یابد (روی دیسک nginx جمع نمی‌شود)
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_read_timeout 300s; proxy_send_timeout 300s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # ساخت فایل از نتیجهٔ ابزارهای PDF (کافی‌نت وارد شده): آپلود چندبخشی تا ~۱۱۰ مگابایت
  location = /api/uploads/derive {
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_read_timeout 300s; proxy_send_timeout 300s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # هدرهای ارسالی کاربر «بازنویسی» می‌شوند (نه افزوده): API فقط یک IP می‌بیند که خود nginx تعیین کرده است.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/csp.conf;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /healthz { proxy_pass http://api:8080/healthz; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Real-IP $remote_addr; access_log off; }

  # سرویس‌ورکر و تنظیمات هرگز کش نشوند (به‌روزرسانی فوری)؛ فایل‌های hash‌دار chunks بلندمدت
  location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/csp.conf; add_header Service-Worker-Allowed "/" always; }
  location = /config.js { add_header Cache-Control "no-cache" always; include /etc/nginx/csp.conf; }
  location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/csp.conf; }
  location /chunks/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/csp.conf; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache" always; include /etc/nginx/csp.conf; add_header X-Content-Type-Options nosniff always; }
}
