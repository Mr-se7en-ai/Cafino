# به‌روزرسانی خودکار وابستگی‌ها و ایمیج‌ها (فقط Pull Request باز می‌کند؛ ادغام با شماست).
version: 2
updates:
  - { package-ecosystem: npm, directory: "/", schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: npm, directory: "/server", schedule: { interval: weekly }, open-pull-requests-limit: 5 }
  - { package-ecosystem: npm, directory: "/el/electron-app", schedule: { interval: monthly }, open-pull-requests-limit: 3 }
  - { package-ecosystem: docker, directory: "/server", schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: monthly } }
